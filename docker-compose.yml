# Smart Home v1 — local stack. Everything binds to 127.0.0.1 only (see CLAUDE.md "Security").
#   cp backend/.env.example backend/.env
#   docker compose up -d --build
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate
# Linux (mDNS discovery): docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: smarthome-php
  volumes:
    - ./backend:/var/www/html
  env_file: backend/.env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: smarthome
    DB_USERNAME: smarthome
    DB_PASSWORD: smarthome
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  depends_on:
    db:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
    depends_on: [app]

  app:
    <<: *php

  worker:
    <<: *php
    command: ["supervisord", "-c", "/etc/supervisord.conf"]

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:${REVERB_PUBLIC_PORT:-8081}:8080"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: smarthome
    ports:
      - "127.0.0.1:5432:5432" # reachable by a host-networked worker (Linux override)
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smarthome", "-d", "smarthome"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Vite dev server with HMR on http://localhost:5173 (proxies /api, /sanctum to nginx).
  # Opt-in until the frontend exists: docker compose --profile frontend up
  frontend:
    profiles: ["frontend"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  db-data:
