; Worker container: everything that needs LAN access (mDNS + device sockets) runs here.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:queue]
command=php /var/www/html/artisan queue:work --sleep=1 --tries=1 --max-time=3600
user=www-data
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:devices-listen]
command=php /var/www/html/artisan devices:listen
user=www-data
autorestart=true
startretries=100
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
